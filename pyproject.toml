[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { email = "PARSER_AUTHOR_EMAIL", name = "tree-sitter-lua, Munif Tanjim, karl-police" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "Luau is a small, fast, and embeddable programming language based on Lua with a gradual type system."
keywords = [ "incremental", "parsing", "tree-sitter", "luau" ]
license.text = "MIT"
name = "tree-sitter-luau"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
Funding = ""
Homepage = "https://github.com/luau-lang/luau"

[project.optional-dependencies]
core = [ "tree-sitter~=0.24" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
