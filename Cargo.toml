[package]
authors = [ "tree-sitter-lua, Munif Tanjim, karl-police" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Luau is a small, fast, and embeddable programming language based on Lua with a gradual type system."
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "luau" ]
license = "MIT"
name = "tree-sitter-luau"
readme = "README.md"
repository = "https://github.com/luau-lang/luau"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.2"
